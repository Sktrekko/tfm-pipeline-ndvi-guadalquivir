version: 2

# Comprobaciones sobre los modelos.
#
# Son la segunda capa de calidad del proyecto y no se solapan con la primera.
# Pandera vigila el DataFrame que sale del calculo en Python, fila a fila, antes
# de guardarlo. Estas vigilan el SQL: que un join no haya duplicado filas, que
# una agregacion no haya perdido municipios, que un valor derivado siga estando
# donde tiene que estar. Un error de SQL no rompe ninguna regla de Pandera, y al
# reves tampoco.

models:

  - name: stg_ndvi_daily
    description: Observaciones diarias con las columnas de calendario derivadas.
    columns:
      - name: zone_id
        description: Codigo del INE del municipio.
        tests: [not_null]
      - name: acquisition_date
        tests: [not_null]
      - name: ndvi_mean
        description: NDVI medio del municipio ese dia.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -1, max_value: 1}
      - name: semana
        description: Semana ISO, con la 53 unida a la 52.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, max_value: 52}
      - name: valid_pixel_fraction
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [zone_id, acquisition_date]

  - name: stg_zones
    description: Municipios de la cuenca con la provincia resuelta.
    columns:
      - name: zone_id
        tests: [not_null, unique]
      - name: province_name
        description: Nombre de la provincia; nunca debe quedar sin resolver.
        tests:
          - not_null
          - accepted_values:
              values: [Albacete, Badajoz, Cadiz, 'Ciudad Real', Cordoba,
                       Granada, Huelva, Jaen, Malaga, Sevilla]
      - name: basin_overlap_fraction
        description: Fraccion del termino dentro de la cuenca; por debajo de 0,5 no entra.
        tests:
          - dbt_utils.accepted_range: {min_value: 0.5, max_value: 1.0}

  - name: ndvi_weekly
    description: Serie semanal por municipio, ponderada por pixeles utiles.
    columns:
      - name: ndvi_ponderado
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -1, max_value: 1}
      - name: observaciones
        description: Fechas que entraron en la semana.
        tests:
          - dbt_utils.accepted_range: {min_value: 1}
      - name: zone_id
        tests:
          - relationships: {to: ref('stg_zones'), field: zone_id}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [zone_id, anio, semana]

  - name: ndvi_climatology
    description: Valor normal de cada municipio en cada semana del ano.
    columns:
      - name: ndvi_normal
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -1, max_value: 1}
      - name: ndvi_desviacion
        description: >
          Dispersion entre anos. Sobre un indice acotado en un intervalo de
          longitud dos, una desviacion mayor que uno seria imposible.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: anios_observados
        tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 12}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [zone_id, semana]

  - name: ndvi_anomaly
    description: Desviacion de cada semana respecto de su propia normal.
    columns:
      - name: anomalia_ndvi
        description: >
          Diferencia en unidades de NDVI. Como ambos terminos viven en [-1, 1],
          la diferencia no puede salirse de [-2, 2].
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -2, max_value: 2}
      - name: categoria
        tests:
          - not_null
          - accepted_values:
              values: ['muy por debajo', 'por debajo', 'normal',
                       'por encima', 'muy por encima', 'sin referencia']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [zone_id, anio, semana]
      # El join con la normal no puede haber inventado ni perdido semanas.
      - dbt_utils.equal_rowcount:
          compare_model: ref('ndvi_weekly')

  - name: ndvi_monthly_by_province
    description: Resumen mensual por provincia, ponderado por superficie.
    columns:
      - name: ndvi_ponderado_area
        tests:
          - dbt_utils.accepted_range: {min_value: -1, max_value: 1}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [province_code, anio, mes]

  - name: stg_weather_daily
    description: Observaciones diarias de las estaciones, con ano y mes derivados.
    columns:
      - name: station_id
        tests: [not_null]
      - name: observed_on
        tests: [not_null]
      - name: precipitation_mm
        description: >
          Sin not_null a proposito: el hueco es informacion. Lo que si se
          comprueba es que ninguna lectura sea negativa ni absurda. El record
          diario de Espana anda por los 800 mm, asi que 500 deja margen de sobra
          y aun asi cazaria un error de unidades o una coma decimal mal leida.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 500}
      - name: temp_mean_c
        tests:
          - dbt_utils.accepted_range: {min_value: -25, max_value: 50}
      - name: mes
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, max_value: 12}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [station_id, observed_on]

  - name: weather_monthly_anomaly
    description: Lluvia mensual de cada estacion frente a su propia normal.
    columns:
      - name: station_id
        tests: [not_null]
      - name: dias_con_dato
        description: >
          Nunca puede pasar de los dias del mes. Si pasara, el almacen tendria
          dos filas para el mismo dia y la clave de la tabla estaria rota.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 31}
      - name: ratio_lluvia
        description: >
          Lluvia del mes en tanto por uno de lo normal. La comprobacion se
          limita a las filas que consume el cruce, y esa restriccion es la
          comprobacion misma. Sin ella el maximo de la tabla es 295, de una
          estacion que empezo a medir en 2024 y cuya normal de diciembre son
          0,20 mm de un solo ano: no es lluvia extraordinaria, es una normal que
          no existe. Entre las filas con normal de cuatro anos o mas y el mes
          medido entero, el maximo real baja a 9,0, un julio de 1,2 mm frente a
          una normal de 0,13. El corte en 25 deja sitio de sobra a esos veranos
          y sigue cazando una normal degenerada que se colara en el cruce.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 25
              config:
                where: "normal_fiable and mes_completo"
      - name: anios_observados
        tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 9}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [station_id, anio, mes]

  - name: ndvi_monthly_anomaly
    description: Anomalia mensual de NDVI por municipio, para poder cruzarla con la lluvia.
    columns:
      - name: zone_id
        tests: [not_null]
      - name: ndvi_observado
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -1, max_value: 1}
      - name: anomalia_ndvi
        description: >
          Diferencia entre dos valores acotados en [-1, 1], asi que solo puede
          caer en [-2, 2]. Salirse de ahi significaria que el join con la normal
          ha emparejado municipios distintos.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -2, max_value: 2}
      - name: mes
        tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 12}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [zone_id, anio, mes]

  - name: ndvi_weather_monthly
    description: >
      El cruce de las dos fuentes: vegetacion y lluvia de la cuenca, mes a mes,
      en la misma fila. Es el modelo que sostiene el apartado 7.3 de la memoria.
    columns:
      - name: mes_fecha
        description: Primer dia del mes, para poder ordenar la serie sin trucos.
        tests: [not_null, unique]
      - name: anomalia_ndvi
        tests:
          - dbt_utils.accepted_range: {min_value: -1, max_value: 1}
      - name: fraccion_municipios_por_debajo
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: estaciones
        description: >
          Estaciones con el mes completo y normal fiable. Si un mes bajara de
          treinta, la media de la cuenca dejaria de representarla y habria que
          mirar que paso con la red antes de creerse la fila.
        tests:
          - dbt_utils.accepted_range: {min_value: 30, max_value: 120}
      - name: municipios
        tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 445}
