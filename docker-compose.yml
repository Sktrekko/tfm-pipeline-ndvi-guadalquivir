# Infraestructura local del lakehouse.
#
# Son dos servicios con responsabilidades separadas, y esa separacion es la
# razon de usar Iceberg en lugar de dejar Parquet suelto en una carpeta:
#
#   minio         guarda los bytes (ficheros Parquet y metadatos de Iceberg)
#   iceberg-rest  guarda que ficheros componen cada tabla en cada momento
#
# MinIO habla el protocolo S3, el mismo de Amazon. Migrar a AWS consiste en
# vaciar S3_ENDPOINT_URL y poner credenciales reales: ni una linea de codigo
# de la aplicacion cambia. Esa portabilidad es el argumento de la seccion 5.4
# de la memoria, donde se calcula lo que costaria correr esto en la nube.
services:

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ndvi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API S3, la que usan PyIceberg y DuckDB
      - "9001:9001"   # consola web, para mirar los ficheros con el navegador
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Contenedor de un solo uso: crea el bucket y se apaga. Sin el, el primer
  # intento de escritura fallaria porque el almacen esta vacio.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ndvi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-lakehouse} &&
      echo 'bucket ${S3_BUCKET:-lakehouse} listo'
      "

  # Docker crea los volumenes como root, pero la imagen del catalogo corre con
  # un usuario sin privilegios y no podria escribir su base de datos. Este paso
  # ajusta el dueno del volumen antes de que arranque. Se hace asi, y no con
  # `user: root` en el servicio, para no darle privilegios innecesarios a un
  # proceso que va a estar horas escuchando en un puerto.
  catalog-init:
    image: alpine:3.21
    container_name: ndvi-catalog-init
    command: ["sh", "-c", "mkdir -p /catalog && chown -R 1000:1000 /catalog"]
    volumes:
      - iceberg-catalog:/catalog

  # El catalogo. Es quien sabe que version de cada tabla es la buena, y lo que
  # permite que dos procesos escriban a la vez sin pisarse.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.1
    container_name: ndvi-iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    volumes:
      - iceberg-catalog:/catalog
    environment:
      # El catalogo guarda en esta base de datos que version de cada tabla es la
      # buena. Por defecto la imagen usa SQLite EN MEMORIA, lo que significa que
      # al reiniciar el contenedor las tablas dejan de existir aunque sus
      # ficheros sigan intactos en MinIO. Con una carga historica de horas eso
      # no es aceptable, asi que se apunta a un fichero en un volumen.
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg.db
      CATALOG_JDBC_SCHEMA__VERSION: V1
      CATALOG_WAREHOUSE: s3://${S3_BUCKET:-lakehouse}/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      AWS_REGION: ${S3_REGION:-us-east-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config?warehouse=s3://${S3_BUCKET:-lakehouse}/warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio-data:
  iceberg-catalog:
